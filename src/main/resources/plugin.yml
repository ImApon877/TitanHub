name: TitanHub
version: 1.1.0
main: me.imapon.titanhub.TitanHub
api-version: '1.13'
author: Im_Apon
description: Configurable cross-version hub core.
softdepend: [PlaceholderAPI, Multiverse-Core]
commands:
  titanhub:
    description: Reload TitanHub configuration.
    usage: /titanhub reload
    permission: titanhub.admin
  hub:
    description: Teleport to the hub spawn.
    usage: /hub
  sethub:
    description: Set the hub location and protected hub world.
    usage: /sethub
    permission: titanhub.admin
permissions:
  titanhub.admin:
    description: Allows TitanHub administration and hub protection bypass.
    default: op
